services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 4173
      BASE_PATH: ${BASE_PATH:-/nchu-project}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3-32b}
    expose:
      - "4173"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      BASE_PATH: ${BASE_PATH:-/nchu-project}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
